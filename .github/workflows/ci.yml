name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq flex bison g++ clang

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew update && brew install flex bison gcc llvm

      - name: Build compiler
        run: make clean && make -j4

      - name: Run smoke test
        run: make test

      - name: Build standalone demos
        run: make demos

      - name: Build First/Follow tool
        run: make ff

      - name: Generate LLVM IR
        run: make llvm-ir
        if: runner.os == 'Linux'

      - name: Verify all output files exist
        run: |
          ./minicc tests/test_main.mc
          ls -lh output/
          test -f output/test_main.tokens
          test -f output/test_main.ast
          test -f output/test_main.tac
          test -f output/test_main.opt.tac
